{% extends "admin_layout.html" %}

{% block title %}Wait Time Predictions{% endblock %}

{% block head %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<header class="page-header">
    <h1>Wait Time Predictions</h1>
    <p>Estimated wait time (in minutes) for the next 10 positions in the queue.</p>
</header>

<div class="content-block">
    <div class="chart-container" style="position: relative; height:60vh; width:100%; margin-top: 2rem;">
        <canvas id="predictionsChart"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const ctx = document.getElementById('predictionsChart').getContext('2d');
            
            fetch('/api/wait-time-predictions')
                .then(response => response.json())
                .then(data => {
                    if (data.labels && data.data) {
                        new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: data.labels,
                                datasets: [{
                                    label: 'Estimated Wait Time (minutes)',
                                    data: data.data,
                                    fill: false,
                                    borderColor: 'rgb(75, 192, 192)',
                                    tension: 0.1
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        title: { display: true, text: 'Minutes' }
                                    }
                                }
                            }
                        });
                    }
                });
        });
    </script>
{% endblock %}
