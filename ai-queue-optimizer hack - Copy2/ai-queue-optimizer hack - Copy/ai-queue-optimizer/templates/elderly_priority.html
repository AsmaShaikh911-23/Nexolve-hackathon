<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderly & Priority Queue</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f3f4f6;
        }
        .modal {
            position: fixed;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            overflow: auto;
        }
        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 500px;
            margin: 6% auto;
            border-radius: 12px;
            padding: 20px;
            animation: fadeIn .3s;
        }
        @keyframes fadeIn {
            from {opacity:0; transform: scale(0.95);}
            to {opacity:1; transform: scale(1);}
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">🧓 Elderly & Priority Queue</h2>

    <div class="card p-4 shadow">

        <p class="text-muted">
            Priority queue is meant for elderly, people with disabilities, and emergency cases.
        </p>

        <button class="btn btn-primary w-100" onclick="openPriorityModal()">
            Join Priority Queue
        </button>

    </div>
</div>


<!-- PRIORITY QUEUE POPUP MODAL -->
<div id="priorityModal" class="modal">
    <div class="modal-content">

        <h4 class="text-center mb-3">Priority Queue Registration</h4>

        <form id="priorityQueueForm">

            <label><strong>Full Name:</strong></label>
            <input type="text" name="name" class="form-control" required>

            <label class="mt-3"><strong>Age:</strong></label>
            <input type="number" name="age" class="form-control" min="1" required>

            <label class="mt-3"><strong>Contact Number:</strong></label>
            <input type="text" name="contact" class="form-control" required>

            <label class="mt-3"><strong>Reason for Priority:</strong></label>
            <textarea name="reason" class="form-control" required></textarea>

            <label class="mt-3"><strong>Mobility Assistance:</strong></label>
            <select name="mobility" class="form-control">
                <option value="None">None</option>
                <option value="Wheelchair">Wheelchair</option>
                <option value="Walker">Walker</option>
            </select>

            <label class="mt-3"><strong>Priority Badge:</strong></label>
            <select name="priority_badge" class="form-control">
                <option value="Elderly">Elderly (60+)</option>
                <option value="Disabled">Disabled</option>
                <option value="Emergency">Emergency Case</option>
            </select>

            <button type="submit" class="btn btn-success w-100 mt-4">
                Submit & Join Queue
            </button>

            <button type="button" class="btn btn-danger w-100 mt-2" onclick="closePriorityModal()">
                Cancel
            </button>

        </form>

    </div>
</div>



<!-- SUCCESS MODAL -->
<div id="successModal" class="modal">
    <div class="modal-content text-center">

        <h4 class="text-success">🎉 Successfully Joined!</h4>
        <p id="successMessage" class="mt-2"></p>

        <button class="btn btn-primary w-100 mt-3" onclick="goToDashboard()">
            Go to Dashboard
        </button>

        <button class="btn btn-secondary w-100 mt-2" onclick="closeSuccessModal()">
            Close
        </button>
    </div>
</div>




<script>
// Open modal
function openPriorityModal() {
    document.getElementById("priorityModal").style.display = "block";
}

// Close modal
function closePriorityModal() {
    document.getElementById("priorityModal").style.display = "none";
}

// Success modal control
function closeSuccessModal() {
    document.getElementById("successModal").style.display = "none";
}

function goToDashboard() {
    window.location.href = "/user_dashboard";
}


// AJAX SUBMIT
document.getElementById("priorityQueueForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    let formData = new FormData(this);

    let response = await fetch("/join_priority_queue", {
        method: "POST",
        body: formData
    });

    let result = await response.json();

    if (result.status === "success") {

        closePriorityModal();

        document.getElementById("successMessage").innerText =
            "Your token: " + result.token + "\nEstimated Wait: " + result.eta;

        document.getElementById("successModal").style.display = "block";
    } 
    else {
        alert("Error: " + result.message);
    }
});
</script>

</body>
</html>
